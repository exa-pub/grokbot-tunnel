# CI: version → checks (lint, unit tests, end-to-end, systemd, comparison with the recorded
# desktop client, fuzzing, generated code) and release archives in parallel → release of the
# archives (push to main only, once every check has passed).
#
# Version = latest vX.Y.Z tag + bump based on conventional commits since that tag:
#   `type!:` / `BREAKING CHANGE:` → major (minor before 1.0), `feat:` → minor, anything else → patch.
# No tags yet → v0.1.0. Pull requests get a -g<sha> suffix, which `grokbot-tunnel update` treats as
# a development build. The release creates the tag; keep the archive names and checksums.txt, which
# install.sh and `grokbot-tunnel update` download.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags
          persist-credentials: false

      - id: version
        shell: bash
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          semver_re='^v([0-9]+)\.([0-9]+)\.([0-9]+)$'
          glob='v[0-9]*.[0-9]*.[0-9]*'

          # Re-run of an already released commit: keep its version.
          version="$(git tag --points-at HEAD --list "$glob" | grep -E "$semver_re" | sort -V | tail -n1 || true)"

          if [ -z "$version" ]; then
            base="$(git describe --tags --abbrev=0 --match "$glob" --exclude '*-*' HEAD 2>/dev/null || true)"
            if [[ "$base" =~ $semver_re ]]; then
              major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
              subjects="$(git log --format=%s "$base..HEAD")"
              bodies="$(git log --format=%b "$base..HEAD")"
              if grep -qiE '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -qE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
                if [ "$major" -eq 0 ]; then version="v0.$((minor + 1)).0"; else version="v$((major + 1)).0.0"; fi
              elif grep -qiE '^feat(\([^)]*\))?:' <<<"$subjects"; then
                version="v$major.$((minor + 1)).0"
              else
                version="v$major.$minor.$((patch + 1))"
              fi
            else
              version="v0.1.0"
            fi
          fi

          if [ -n "$PR_SHA" ]; then
            version="$version-g${PR_SHA:0:7}"
          fi

          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "### Version: \`$version\`" >>"$GITHUB_STEP_SUMMARY"

  # golangci-lint (govet included) and shellcheck.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.15.0

      - name: Shellcheck
        run: make shellcheck

  # Unit tests with the race detector; zsh and ripgrep so that their code paths run.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install zsh and ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh ripgrep

      - name: Test
        run: |
          set -o pipefail
          make test-race COVERPROFILE=coverage.out | tee test.log

      - name: Coverage by package
        run: |
          grep -E 'coverage: ' test.log | tee coverage.txt
          go tool cover -func=coverage.out | tail -1 | tee -a coverage.txt
          echo "### Coverage: $(tail -1 coverage.txt | awk '{print $NF}')" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: error

  # The built binary against the fake backend (tests/e2e/fakesand).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: End-to-end tests
        run: make e2e

  # Install, update and uninstall under systemd, in a container.
  systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install, update and uninstall under systemd
        run: make systemd-test

  # The answers of the desktop client recorded in testdata/compat/<version>/.
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Compare with the recorded desktop client
        run: make compare-golden

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compare
          path: tests/compare/out
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The latest Go, not the minimum of go.mod: older toolchains can fail a
      # fuzz run with "context deadline exceeded" when -fuzztime runs out
      # (go.dev/issue/75804), without any failing input.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Fuzz parsers for 10 s each
        run: make fuzz FUZZTIME=10s

  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Check generated code is up to date
        run: make proto-check

  # Release archives of the version, built while the checks run.
  dist:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build release archives
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: make dist VERSION="$VERSION"

      - name: Smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tar -xzf dist/grokbot-tunnel-linux-amd64.tar.gz -C "$RUNNER_TEMP"
          out="$("$RUNNER_TEMP/grokbot-tunnel-linux-amd64" --version)"
          echo "$out"
          grep -qF "grokbot-tunnel $VERSION " <<<"$out"
          ls -l dist | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: [version, lint, test, e2e, systemd, compare, fuzz, proto, dist]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tag and GitHub Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping."
            exit 0
          fi
          gh release create "$VERSION" dist/*.tar.gz dist/checksums.txt --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes --latest
          echo "### 🚀 Released \`$VERSION\`" >>"$GITHUB_STEP_SUMMARY"
