version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  default: standard
  disable:
    - ineffassign # intentional ctx shadowing
  enable:
    - misspell
    - errorlint
    - nilerr
    - revive
    - unconvert
    - prealloc
    - bodyclose
    - noctx
    - durationcheck
    - makezero
    - nilnil
    - gocognit
    - cyclop
    - funlen
    - lll
    - gosec
    - testifylint
    - depguard
    - funcorder

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (*google.golang.org/grpc.ClientConn).Close

    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true

    gocognit:
      min-complexity: 25

    cyclop:
      max-complexity: 15

    funlen:
      lines: 60
      statements: 40

    lll:
      line-length: 140
      tab-width: 4

    govet:
      disable:
        - fieldalignment

    misspell:
      locale: US

    prealloc:
      simple: true
      for-loops: true

    depguard:
      # Layers (CONTRIBUTING.md, Code layout): entity < pkg < adapter, repository < service < api < app.
      # Tests may cross layers.
      rules:
        entity:
          files:
            - "**/internal/entity/**"
            - "!$test"
          deny:
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/"
              desc: entity depends on nothing inside internal (CONTRIBUTING.md, Code layout)
        pkg:
          files:
            - "**/internal/pkg/**"
            - "!$test"
          deny:
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/adapter"
              desc: pkg depends only on entity and gen
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/repository"
              desc: pkg depends only on entity and gen
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/service"
              desc: pkg depends only on entity and gen
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/api"
              desc: pkg depends only on entity and gen
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/app"
              desc: pkg depends only on entity and gen
        adapter-repository:
          files:
            - "**/internal/adapter/**"
            - "**/internal/repository/**"
            - "!$test"
          deny:
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/service"
              desc: adapters and repositories depend only on lower layers
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/api"
              desc: adapters and repositories depend only on lower layers
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/app"
              desc: adapters and repositories depend only on lower layers
        service:
          files:
            - "**/internal/service/**"
            - "!$test"
          deny:
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/api"
              desc: services depend only on lower layers
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/app"
              desc: services depend only on lower layers
        service-computer:
          files:
            - "**/internal/service/computer/**"
            - "!$test"
          deny:
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/service/localexec"
              desc: a service does not import another service; declare an interface at the consumer
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/service/permission"
              desc: a service does not import another service; declare an interface at the consumer
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/service/login"
              desc: a service does not import another service; declare an interface at the consumer
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/service/install"
              desc: a service does not import another service; declare an interface at the consumer
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/service/selfupdate"
              desc: a service does not import another service; declare an interface at the consumer
            - pkg: "github.com/exa-pub/grokbot-tunnel/internal/service/tokens"
              desc: a service does not import another service; declare an interface at the consumer
        service-localexec:
